name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # cancela so em PR: um push na main sempre termina (e publica a imagem)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.4.1"
  AIRFLOW_VERSION: "3.3.2"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .

  test:
    name: Testes (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install --no-interaction
      - run: poetry run pytest --cov=src --cov-report=term-missing

  dag-validate:
    name: Validacao da DAG (Airflow)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instala Airflow (com constraints oficiais) e deps de treino
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install -r docker/airflow/requirements.txt pytest
      - name: DagBag sem erros de import e estrutura esperada
        run: |
          airflow db migrate
          pytest tests/test_dag.py -v
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"

  monitoring:
    name: Monitoramento (promtool + dashboard)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Config e regras do Prometheus (promtool)
        run: |
          # mesma imagem do docker-compose.yml; o rule_files /etc/prometheus/alerts.yml
          # cai dentro do mount, entao o check config valida as regras tambem
          image=$(grep -oE 'prom/prometheus:[^[:space:]]+' docker-compose.yml)
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$image" check config /etc/prometheus/prometheus.yml
      - name: Dashboard do Grafana igual ao gerado pelo script
        run: |
          python scripts/build_grafana_dashboard.py
          git diff --exit-code monitoring/grafana/dashboards/

  build:
    name: Treino + build + smoke test da imagem
    needs: [test, dag-validate, monitoring]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # so push na main publica a imagem; PR e workflow_dispatch apenas validam
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install --no-interaction --only main
      - name: Pipeline de treino
        run: |
          poetry run python -m medical_triage.data.ingest
          poetry run python -m medical_triage.data.preprocess
          poetry run python -m medical_triage.models.train
          poetry run python -m medical_triage.models.export_onnx
      - name: Quality gate do modelo
        run: |
          poetry run python - <<'PY'
          from medical_triage.config import get_settings, load_params
          from medical_triage.models.registry import quality_gate, read_metrics
          failures = quality_gate(read_metrics(get_settings().model_dir), None, load_params()["quality_gate"])
          assert not failures, failures
          print("quality gate ok")
          PY
      - name: Build da imagem
        run: docker build -t medical-triage:${{ github.sha }} .
      - name: Smoke test do container (sklearn e ONNX)
        run: |
          for backend in sklearn onnx; do
            docker rm -f api >/dev/null 2>&1 || true
            docker run -d --name api -e MODEL_BACKEND=$backend -p 8080:8000 medical-triage:${{ github.sha }}
            for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 2; done
            curl -sf localhost:8080/health | grep -q "\"model_backend\":\"$backend\""
            curl -sf localhost:8080/health | grep -q '"model_loaded":true'
            curl -sf -X POST localhost:8080/predict -H 'Content-Type: application/json' \
              -d '{"text":"Acute myocardial infarction and coronary artery disease"}' | tee /dev/stderr \
              | grep -q '"urgency":"urgente"'
          done
      - name: Logs do container (em caso de falha)
        if: failure()
        run: docker logs api || true
      # CD: publica a mesma imagem que passou no smoke test (a imagem local nao passa
      # de um job para outro, por isso o push fica no fim deste job)
      - name: Login no GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push da imagem para o GHCR
        if: env.PUBLISH == 'true'
        run: |
          # nome de imagem no registry precisa ser minusculo (owner e Plee47)
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medical-triage
          for tag in ${{ github.sha }} latest; do
            docker tag medical-triage:${{ github.sha }} "$image:$tag"
            docker push "$image:$tag"
          done
