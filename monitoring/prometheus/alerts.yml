groups:
  - name: triage-api
    rules:
      - alert: TriageApiDown
        expr: up{job="triage-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: API de triagem fora do ar

      - alert: TriageModelNotLoaded
        expr: triage_model_loaded == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: API no ar, mas sem modelo carregado (/predict responde 503)

      - alert: TriageHighErrorRate
        expr: |
          sum(rate(http_requests_total{route="/predict",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{route="/predict"}[5m])) > 0.05
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Mais de 5% de erros 5xx no /predict

      - alert: TriageHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{route="/predict"}[5m]))) > 0.2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: p95 do /predict acima de 200 ms

      - alert: TriageLowConfidenceSpike
        expr: |
          sum(rate(triage_prediction_confidence_bucket{le="0.5"}[15m]))
            / sum(rate(triage_prediction_confidence_count[15m])) > 0.65
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Mais de 65% das predicoes com confianca < 0.5 (baseline ~45-48%; possivel drift nos laudos)
          description: O baseline e o low_confidence_rate de validacao/teste que o train.py grava em models/metrics.json
