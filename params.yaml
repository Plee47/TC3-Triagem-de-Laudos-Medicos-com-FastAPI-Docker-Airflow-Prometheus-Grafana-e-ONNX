seed: 42

data:
  base_url: https://raw.githubusercontent.com/sebischair/Medical-Abstracts-TC-Corpus/main
  files: [medical_tc_train.csv, medical_tc_test.csv, medical_tc_labels.csv]
  validation_size: 0.15

tfidf:
  ngram_max: 2
  max_features: 50000
  min_df: 2
  # false de proposito: o conversor skl2onnx implementa sublinear_tf como
  # log(1 + tf), e nao 1 + log(tf) como o sklearn, o que quebra a paridade com o ONNX.
  # Sem ele o modelo ficou igual ou melhor (val macro-F1 0,750 -> 0,761).
  sublinear_tf: false

model:
  C: 1.0
  max_iter: 2000

# Quality gate do retreino: o candidato so substitui o modelo em producao se
# atingir os minimos absolutos e nao piorar mais que max_regression.
quality_gate:
  min_macro_f1: 0.70
  min_urgente_recall: 0.75
  max_regression: 0.02
