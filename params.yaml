seed: 42

data:
  base_url: https://raw.githubusercontent.com/sebischair/Medical-Abstracts-TC-Corpus/main
  files: [medical_tc_train.csv, medical_tc_test.csv, medical_tc_labels.csv]
  validation_size: 0.15

tfidf:
  ngram_max: 2
  max_features: 50000
  min_df: 2
  sublinear_tf: true

model:
  C: 1.0
  max_iter: 2000

# Quality gate do retreino: o candidato so substitui o modelo em producao se
# atingir os minimos absolutos e nao piorar mais que max_regression.
quality_gate:
  min_macro_f1: 0.70
  min_urgente_recall: 0.75
  max_regression: 0.02
